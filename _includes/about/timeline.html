<div class="col mt-4">
  <div class="timeline-body bg-themed" style="background-color: transparent;">
         
    <h4 class="mb-3" style="padding-left: 1rem;">{{ include.title }}</h4>
      
    {% for item in include.source %}
      <div class="timeline-item">
        <div class="content">
          <p>{{ item.title }}</p>
          <p class="date">{{ item.from }} — {{ item.to }}</p>
          <p class="date">{{item.location}}</p>
          <p style="font-style: italic;">{{item.type}}</p>
          <!-- <p>{{ item.description }}</p> -->
          <ul>
            {% for point in item.description %}
              <li>{{ point }}</li>
            {% endfor %}
          </ul>
          <p>{{ item.focus }}</p>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
